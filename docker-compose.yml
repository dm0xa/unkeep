services:
  unkeep:
    build: .
    image: unkeep:local
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 512m
    stop_grace_period: 15s
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      GOMEMLIMIT: 400MiB
      TRUST_PROXY: "0"
